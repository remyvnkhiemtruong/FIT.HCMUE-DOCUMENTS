services:
  app:
    build:
      target: development
    read_only: false
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    tmpfs:
      - /app/.nuxt:uid=1000,gid=1000,mode=0755
    volumes:
      - ./app:/app/app:ro
      - ./server:/app/server:ro
      - ./shared:/app/shared:ro
      - ./public:/app/public:ro
      - ./nuxt.config.ts:/app/nuxt.config.ts:ro
